services:
  web:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-form_engine}:${POSTGRES_PASSWORD:-form_engine}@postgres:5432/${POSTGRES_DB:-form_engine}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/.venv/bin/python manage.py migrate --noinput && /app/.venv/bin/python manage.py collectstatic --noinput && exec /app/.venv/bin/uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/backend/staticfiles

  celery:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-form_engine}:${POSTGRES_PASSWORD:-form_engine}@postgres:5432/${POSTGRES_DB:-form_engine}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["/app/.venv/bin/celery", "-A", "config", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-form_engine}:${POSTGRES_PASSWORD:-form_engine}@postgres:5432/${POSTGRES_DB:-form_engine}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    command:
      [
        "/bin/sh",
        "-c",
        "exec /app/.venv/bin/celery -A config flower --port=5555 $${FLOWER_BASIC_AUTH:+--basic_auth=$$FLOWER_BASIC_AUTH}",
      ]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-form_engine}
      POSTGRES_USER: ${POSTGRES_USER:-form_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-form_engine}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  static_data:
